version: '3.8'

services:
  app:
    build:
      context: ../
      dockerfile: deploy/docker/Dockerfile
    image: laravel-app:latest
    container_name: laravel_app
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    volumes:
      - storage_data:/var/www/app/storage
      - cache_data:/var/www/app/bootstrap/cache
    env_file:
      - ../.env
    networks:
      - laravel_network
    depends_on:
      - redis
      - db

  redis:
    image: redis:7-alpine
    container_name: laravel_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - laravel_network
    command: redis-server --appendonly yes

  db:
    image: mysql:8.0
    container_name: laravel_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - laravel_network

  # Optional: Add nginx as reverse proxy with SSL termination
  nginx:
    image: nginx:alpine
    container_name: laravel_nginx
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./docker/nginx-ssl.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
    networks:
      - laravel_network
    depends_on:
      - app
    profiles:
      - ssl

volumes:
  storage_data:
    driver: local
  cache_data:
    driver: local
  redis_data:
    driver: local
  db_data:
    driver: local

networks:
  laravel_network:
    driver: bridge